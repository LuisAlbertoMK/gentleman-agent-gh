name: Release

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run if triggered by tag push AND quality gate passed
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          # Extract unreleased section from CHANGELOG
          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' docs/CHANGELOG.md > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
