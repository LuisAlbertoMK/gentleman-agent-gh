name: Release

on:
  workflow_run:
    workflows: ["Quality Gate"]
    types: [completed]
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  quality-gate-check:
    name: Quality Gate passed?
    runs-on: ubuntu-latest
    # Runs on every path that can release. The workflow_run path already proves
    # Quality Gate concluded success; the tag-push path verifies it explicitly
    # (C3b: a tag push must NOT release without a passing Quality Gate run).
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Verify Quality Gate succeeded for the tag commit
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            if (context.eventName === 'push') {
              // Tag-push path: block unless a completed Quality Gate run
              // succeeded on the exact commit the tag points to.
              let run = null;
              for (let page = 1; page <= 5 && !run; page++) {
                const res = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'quality-gate.yml',
                  status: 'completed',
                  per_page: 100,
                  page,
                });
                run = res.data.workflow_runs.find(
                  (r) => r.head_sha === context.sha && r.conclusion === 'success'
                ) || null;
              }
              if (!run) {
                core.setFailed(
                  `Quality Gate has not passed for tag commit ${context.sha.slice(0, 7)} - refusing to release.`
                );
              }
              core.info('Quality Gate succeeded for tag commit - releasing.');
            } else {
              core.info(
                `workflow_run path: Quality Gate concluded ${github.event.workflow_run.conclusion} - releasing.`
              );
            }

  release:
    needs: quality-gate-check
    runs-on: ubuntu-latest
    # Only run if triggered by tag push AND quality gate passed (checked by quality-gate-check)
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          # Extract unreleased section from CHANGELOG
          awk '/^## \[Unreleased\]/{flag=1; next} /^## \[/{flag=0} flag' docs/CHANGELOG.md > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          generate_release_notes: false
