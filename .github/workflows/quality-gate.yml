name: Quality Gate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality-gate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Cross-ref validation — skills, index, references
        run: ./scripts/cross-ref-check.ps1

      - name: Skill drift check — canonical vs global config
        if: runner.os == 'Windows'
        run: ./scripts/check-skill-drift.ps1

      - name: PS7 version gate — verify all scripts require 7.6
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'experiments|node_modules|metricas\\assets' } | Where-Object {
            $c = (Get-Content $_ -Head 3) -join "`n"; $c -notmatch '#requires -Version 7'
          }
          # ps5-detect.ps1 intentionally targets PS5.1 — skip it
          $bad = $bad | Where-Object { $_.Name -ne 'ps5-detect.ps1' }
          if ($bad) { $bad | ForEach-Object { Write-Output "::warning title=Missing PS7::$($_.Name)" }; exit 1 }
          else { Write-Output "OK: All .ps1 scripts require PS7+" }

      - name: Downstream tests — delivery-harness, chained-pr, subagent-isolation
        run: ./scripts/test-downstream.ps1

      - name: Benchmark report — system health snapshot
        run: ./scripts/benchmark.ps1

      - name: Overweight skill check — warn if any skill >3KB
        run: |
          $overweight = Get-ChildItem .agents/skills -Directory | Where-Object { $_.Name -ne '_shared' } | ForEach-Object {
            $md = Join-Path $_.FullName 'SKILL.md'
            if (Test-Path $md) {
              $len = (Get-Content $md -Raw).Length
              if ($len -gt 3072) { Write-Output "$($_.Name) ($($len)B)" }
            }
          }
          if ($overweight) {
            Write-Output "::warning title=Overweight Skills::Skills exceeding 3KB limit"
            $overweight
          } else {
            Write-Output "OK: All skills ≤3KB"
          }

      - name: SkillSpector security gate — Docker fallback (non-blocking)
        continue-on-error: true
        run: ./scripts/skillspector-gate.ps1

      - name: Error snapshot — persist CI quality gate results
        if: always()
        run: ./scripts/capture-errors.ps1 -Snapshot
