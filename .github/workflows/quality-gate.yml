name: Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: qg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: opencode.json config validation
        run: node scripts/lib/generate-opencode-config.js --validate

      - name: PS7 checks (syntax + version gate)
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch 'experiments|node_modules|metricas\\assets'
          } | ForEach-Object {
            $c = (Get-Content $_ -Head 3) -join "`n"
            $ps5Only = $_.Name -in @('ps5-detect.ps1', 'sync-global-ps5.ps1')
            if ($c -notmatch '#requires -Version 7(\.0)?' -and -not $ps5Only) {
              Write-Output "::warning title=Missing PS7::$($_.Name)"; $fail++; return
            }
            try { $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$null); Write-Output "OK: $($_.Name)" }
            catch { Write-Warning "Syntax error: $($_.Name) — $($_.Exception.Message)"; $fail++ }
          }
          if ($fail) { exit 1 }

      - name: Overweight skill check
        run: |
          $overweight = Get-ChildItem .agents/skills -Directory | Where-Object { $_.Name -ne '_shared' } | ForEach-Object {
            $md = Join-Path $_.FullName 'SKILL.md'
            if (Test-Path $md) { $len = (Get-Content $md -Raw).Length; if ($len -gt 3072) { "$($_.Name) ($($len)B)" } }
          }
          if ($overweight) { Write-Output "::warning title=Overweight Skills::Skills exceeding 3KB limit"; $overweight }
          else { Write-Output "OK: All skills ≤3KB" }

      - name: Permission consistency
        run: |
          $config = Get-Content 'opencode.json' -Raw | ConvertFrom-Json
          $readOnlyAgents = @('gentleman-security', 'gentleman-seo', 'gentleman-infra', 'gentleman-frontend', 'gentleman-performance', 'gentleman-datascience', 'gentleman-docs')
          $fail = 0
          foreach ($agent in $readOnlyAgents) {
            $a = $config.agent.$agent
            if (-not $a) { Write-Warning "Agent not found: $agent"; $fail++; continue }
            $bashDeny = $a.permission.bash.'*'
            if ($bashDeny -ne 'deny') { Write-Error "FAIL: $agent has bash.* = $bashDeny (expected deny)"; $fail++ }
          }
          $orchBash = $config.agent.'gentleman-vMK'.permission.bash
          if ($orchBash.'*' -ne 'ask') { Write-Error "FAIL: orchestrator bash.* = $($orchBash.'*') (expected ask — delegates, never implements)"; $fail++ }
          $orchTask = $config.agent.'gentleman-vMK'.permission.task
          if (-not $orchTask -or $orchTask.'gentleman-reviewer' -ne 'allow') { Write-Error "FAIL: orchestrator missing task.gentleman-reviewer allow"; $fail++ }
          if ($fail) { exit 1 }
          Write-Output "OK: All permission consistency checks passed"

  lint-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: ./scripts/install.sh --yes --skip-env-var --skip-shortcuts
      - name: Shellcheck
        shell: bash
        run: |
          if command -v shellcheck &>/dev/null; then shellcheck scripts/*.sh
          else for f in scripts/*.sh; do bash -n "$f" && echo "OK: $f" || exit 1; done; fi

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      - name: pre-commit — security & lint hooks
        run: |
          if (-not (Get-Command pre-commit -ErrorAction SilentlyContinue)) { pip install pre-commit }
          $hooks = @('trailing-whitespace', 'end-of-file-fixer', 'check-yaml', 'check-json', 'check-added-large-files', 'actionlint', 'gitleaks', 'secrets-scan', 'pssa-gate')
          foreach ($h in $hooks) {
            pre-commit run --all-files --show-diff-on-failure $h
            if ($LASTEXITCODE -ne 0) { Write-Error "pre-commit hook failed: $h"; exit $LASTEXITCODE }
          }

      - name: trufflehog — deep secrets scan
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          # NOTE: the action already adds --fail; repeating it aborts ("flag 'fail' cannot be repeated").
          # Globs must NOT be quoted here — bash word-splits $ARGS without re-interpreting quotes,
          # so quoted globs arrive literally and never match. Delta scan (base=event.before) does not need them.
          extra_args: --only-verified

      - name: SkillSpector — install
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git@v2.5.0 --quiet || echo "SkillSpector install failed"

      - name: SkillSpector security gate
        continue-on-error: false
        run: ./scripts/skillspector-gate.ps1 -Strict -FailOnRisk 50

  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: psmodules-${{ hashFiles('scripts/tests/*.Tests.ps1') }}
          restore-keys: psmodules-

      - name: Skill drift check
        run: ./scripts/check-skill-drift.ps1

      - name: Pester unit tests
        run: |
          $results = Invoke-Pester -Path './scripts/tests/*.Tests.ps1' -PassThru
          if ($results.FailedCount -gt 0) {
            Write-Error "Pester: $($results.FailedCount) test(s) failed"
            exit 1
          }
          Write-Output "OK: $($results.PassedCount)/$($results.TotalCount) tests passed"

      - name: Windows smoke test
        run: |
          ./scripts/verify.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Benchmark report
        run: ./scripts/benchmark.ps1 -Snapshot

      - name: Error snapshot
        if: always()
        run: ./scripts/capture-errors.ps1 -Snapshot
