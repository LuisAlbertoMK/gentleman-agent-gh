name: Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-gate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Linux/macOS setup test — verify install.sh runs cleanly
        if: runner.os == 'Linux'
        run: ./scripts/install.sh --yes --skip-env-var --skip-shortcuts

      - name: Cross-platform — shellcheck bash scripts (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh
          else
            # fallback: bash -n syntax check
            for f in scripts/*.sh; do
              bash -n "$f" && echo "OK: $f" || exit 1
            done
          fi

      - name: Cross-platform — PS7 syntax check .ps1 on Linux
        if: runner.os == 'Linux'
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch 'experiments|node_modules|metricas\\assets'
          } | ForEach-Object {
            try {
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$null
              )
              Write-Output "OK: $($_.Name)"
            } catch {
              Write-Warning "Syntax error: $($_.Name) — $($_.Exception.Message)"
              $fail++
            }
          }
          if ($fail) { exit 1 }

      - name: Cross-ref validation — skills, index, references
        run: ./scripts/cross-ref-check.ps1

      - name: Skill drift check — canonical vs global config
        if: runner.os == 'Windows'
        run: ./scripts/check-skill-drift.ps1

      - name: PS7 version gate — verify all scripts require 7.6
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'experiments|node_modules|metricas\\assets' } | Where-Object {
            $c = (Get-Content $_ -Head 3) -join "`n"; $c -notmatch '#requires -Version 7'
          }
          # ps5-detect.ps1 intentionally targets PS5.1 — skip it
          $bad = $bad | Where-Object { $_.Name -ne 'ps5-detect.ps1' }
          if ($bad) { $bad | ForEach-Object { Write-Output "::warning title=Missing PS7::$($_.Name)" }; exit 1 }
          else { Write-Output "OK: All .ps1 scripts require PS7+" }

      - name: Pester unit tests — core script logic
        run: |
          $results = Invoke-Pester -Path './scripts/*.tests.ps1' -PassThru
          if ($results.FailedCount -gt 0) {
            Write-Error "Pester: $($results.FailedCount) test(s) failed"
            exit 1
          }
          Write-Output "OK: $($results.PassedCount)/$($results.TotalCount) tests passed"

      - name: Benchmark report — system health snapshot
        run: ./scripts/benchmark.ps1

      - name: Overweight skill check — warn if any skill >3KB
        run: |
          $overweight = Get-ChildItem .agents/skills -Directory | Where-Object { $_.Name -ne '_shared' } | ForEach-Object {
            $md = Join-Path $_.FullName 'SKILL.md'
            if (Test-Path $md) {
              $len = (Get-Content $md -Raw).Length
              if ($len -gt 3072) { Write-Output "$($_.Name) ($($len)B)" }
            }
          }
          if ($overweight) {
            Write-Output "::warning title=Overweight Skills::Skills exceeding 3KB limit"
            $overweight
          } else {
            Write-Output "OK: All skills ≤3KB"
          }

      - name: pre-commit — all hooks (local + remote)
        run: |
          if (Get-Command pre-commit -ErrorAction SilentlyContinue) {
            pre-commit run --all-files --show-diff-on-failure
          } elseif (Get-Command py -ErrorAction SilentlyContinue) {
            py -m pre_commit run --all-files --show-diff-on-failure
          } else {
            Write-Warning "pre-commit not available — SKIP (non-blocking)"
          }

      - name: trufflehog — deep secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail --exclude-globs '.learnings/*,.backup-*/**'

      - name: Windows smoke test — verify key scripts exit clean
        if: runner.os == 'Windows'
        run: |
          ./scripts/verify.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SkillSpector — install (Linux only)
        if: runner.os == 'Linux'
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git --quiet || echo "SkillSpector install failed — gate will fail in strict mode"

      - name: SkillSpector security gate — static analysis (blocking on failures)
        if: runner.os == 'Linux'
        continue-on-error: false
        run: ./scripts/skillspector-gate.ps1 -Strict -FailOnRisk 50

      - name: SkillSpector security gate — skip (not available on Windows)
        if: runner.os == 'Windows'
        run: Write-Output "⚪ SkillSpector not available on Windows — skipping"

      - name: Error snapshot — persist CI quality gate results
        if: always()
        run: ./scripts/capture-errors.ps1 -Snapshot
