name: Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: qg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Linux/macOS setup test
        if: runner.os == 'Linux'
        run: ./scripts/install.sh --yes --skip-env-var --skip-shortcuts

      - name: Shellcheck bash scripts (Linux)
        if: runner.os == 'Linux'
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck scripts/*.sh
          else
            for f in scripts/*.sh; do
              bash -n "$f" && echo "OK: $f" || exit 1
            done
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: opencode.json config validation
        run: node scripts/lib/generate-opencode-config.js --validate

      - name: PS7 syntax check .ps1
        run: |
          $fail = 0
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object {
            $_.FullName -notmatch 'experiments|node_modules|metricas\\assets'
          } | ForEach-Object {
            try {
              $null = [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$null
              )
              Write-Output "OK: $($_.Name)"
            } catch {
              Write-Warning "Syntax error: $($_.Name) — $($_.Exception.Message)"
              $fail++
            }
          }
          if ($fail) { exit 1 }

      - name: PS7 version gate
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch 'experiments|node_modules|metricas\\assets' } | Where-Object {
            $c = (Get-Content $_ -Head 3) -join "`n"; $c -notmatch '#requires -Version 7'
          }
          $bad = $bad | Where-Object { $_.Name -ne 'ps5-detect.ps1' }
          if ($bad) { $bad | ForEach-Object { Write-Output "::warning title=Missing PS7::$($_.Name)" }; exit 1 }
          else { Write-Output "OK: All .ps1 scripts require PS7+" }

      - name: Overweight skill check
        run: |
          $overweight = Get-ChildItem .agents/skills -Directory | Where-Object { $_.Name -ne '_shared' } | ForEach-Object {
            $md = Join-Path $_.FullName 'SKILL.md'
            if (Test-Path $md) {
              $len = (Get-Content $md -Raw).Length
              if ($len -gt 3072) { Write-Output "$($_.Name) ($($len)B)" }
            }
          }
          if ($overweight) {
            Write-Output "::warning title=Overweight Skills::Skills exceeding 3KB limit"
            $overweight
          } else {
            Write-Output "OK: All skills ≤3KB"
          }

      - name: Permission consistency
        run: |
          $config = Get-Content 'opencode.json' -Raw | ConvertFrom-Json
          $readOnlyAgents = @('gentleman-security', 'gentleman-seo', 'gentleman-infra', 'gentleman-frontend', 'gentleman-performance', 'gentleman-datascience', 'gentleman-docs')
          $fail = 0
          foreach ($agent in $readOnlyAgents) {
            $a = $config.agent.$agent
            if (-not $a) { Write-Warning "Agent not found: $agent"; $fail++; continue }
            $bashDeny = $a.permission.bash.'*'
            if ($bashDeny -ne 'deny') {
              Write-Error "FAIL: $agent has bash.* = $bashDeny (expected deny)"
              $fail++
            }
          }
          $orchBash = $config.agent.'gentleman-vMK'.permission.bash
          if ($orchBash.'python *' -ne 'deny') { Write-Error "FAIL: orchestrator missing python deny"; $fail++ }
          if ($orchBash.'node *' -ne 'deny') { Write-Error "FAIL: orchestrator missing node deny"; $fail++ }
          if ($fail) { exit 1 }
          Write-Output "OK: All permission consistency checks passed"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Cross-ref validation
        run: ./scripts/cross-ref-check.ps1

      - name: pre-commit — all hooks
        run: |
          if (Get-Command pre-commit -ErrorAction SilentlyContinue) {
            pre-commit run --all-files --show-diff-on-failure
          } else {
            pip install pre-commit && pre-commit run --all-files --show-diff-on-failure
          }

      - name: trufflehog — deep secrets scan
        uses: trufflesecurity/trufflehog@v3.95.9
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail --exclude-globs '.learnings/*,.backup-*/**'

      - name: SkillSpector — install
        run: pip install git+https://github.com/NVIDIA/SkillSpector.git@v2.5.0 --quiet || echo "SkillSpector install failed"

      - name: SkillSpector security gate
        continue-on-error: false
        run: ./scripts/skillspector-gate.ps1 -Strict -FailOnRisk 50

  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Skill drift check
        run: ./scripts/check-skill-drift.ps1

      - name: Pester unit tests
        run: |
          $results = Invoke-Pester -Path './scripts/tests/*.Tests.ps1' -PassThru
          if ($results.FailedCount -gt 0) {
            Write-Error "Pester: $($results.FailedCount) test(s) failed"
            exit 1
          }
          Write-Output "OK: $($results.PassedCount)/$($results.TotalCount) tests passed"

      - name: Benchmark report
        run: ./scripts/benchmark.ps1 -Snapshot

      - name: Windows smoke test
        run: |
          ./scripts/verify.ps1 -Quiet
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Error snapshot
        if: always()
        run: ./scripts/capture-errors.ps1 -Snapshot
