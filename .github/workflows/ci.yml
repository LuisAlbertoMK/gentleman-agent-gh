name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pester-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PESTER_TEST: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run full Pester suite
        shell: pwsh
        run: ./scripts/run-ci-tests.ps1

  pssa-lint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint scripts/ with repo settings
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $errors | ForEach-Object { Write-Host "::error file=$($_.ScriptPath) line=$($_.Line):: $($_.RuleName): $($_.Message)" }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Host "[PSSA] 0 errors ($(@($results).Count) total findings)"

      - name: Machine-specific path scan (CI backstop for --no-verify)
        shell: pwsh
        run: |
          $hits = @()
          Get-ChildItem -Path ./scripts,./.githooks -Recurse -Filter *.ps1 | ForEach-Object {
            $lineNo = 0
            foreach ($ln in Get-Content -LiteralPath $_.FullName) {
              $lineNo++
              $code = ($ln -replace '^\s*#.*$', '' -replace "(?<=(?<!`)')#.*$", '')
              if ($code -match '["''](?:[A-Za-z]:[\\/](?:Users|gentleman)[^"'']*)["'']' -and $code -notmatch '\$env:|\$PSScriptRoot|Join-Path') {
                $hits += "$($_.FullName):$lineNo"
              }
            }
          }
          if ($hits.Count -gt 0) { $hits | ForEach-Object { Write-Host "::error:: hardcoded machine path: $_" }; exit 1 }
          Write-Host "[path-scan] clean"
