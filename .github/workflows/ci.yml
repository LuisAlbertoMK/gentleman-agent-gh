name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pester-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PESTER_TEST: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run full Pester suite
        shell: pwsh
        run: ./scripts/run-ci-tests.ps1

  pssa-lint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Lint scripts/ with repo settings
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $errors | ForEach-Object { Write-Host "::error file=$($_.ScriptPath) line=$($_.Line):: $($_.RuleName): $($_.Message)" }
          if ($errors.Count -gt 0) { exit 1 }
          Write-Host "[PSSA] 0 errors ($(@($results).Count) total findings)"
