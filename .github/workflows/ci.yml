name: CI quality gate (ConfigValidator)

# Cycle 3 — G2: validate opencode.json schema before deploy.
# Enfoque A (Minimal) from plan-auto-mejora-v3-2026-08-13 §3: ConfigValidator.psm1
# guards G1 (skills.paths array unwrapping) + G3 (50-agent completeness) + prompt
# ref integrity. Complements .github/workflows/quality-gate.yml (lint/security/tests)
# — this workflow is the fail-fast config gate: quality → tests → validate.
#
# PowerShell Core ONLY: every step uses `shell: pwsh` (never Windows PowerShell).
# Relative paths only — runner is ubuntu-latest, no D:\... paths exist there.

on:
  push:
    branches: [ master, main, 'experimento/**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cfg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality — ConfigValidator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Validate opencode.json schema (ConfigValidator)
        # Fail fast: any check (skills.paths array, prompt refs, agent completeness)
        # failing aborts the pipeline before tests/validate run.
        run: |
          Import-Module ./scripts/lib/ConfigValidator.psm1 -Force
          $code = Test-OpencodeConfig -Path ./opencode.json
          if ($code -ne 0) { Write-Error "opencode.json failed ConfigValidator"; exit $code }
          Write-Output "OK: opencode.json passes ConfigValidator"

  tests:
    name: Tests — Pester (robust runner, R3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester via run-ci-tests.ps1 (pinned 5.5.0, Run.Exit, NUnit)
        # Thin pipeline (R3): central runner script pins Pester, sets Run.Exit=$true
        # (non-zero exit on any failure), and emits NUnit XML for publishing below.
        # Local and CI share the exact same invocation — no inline Pester config drift.
        run: |
          ./scripts/run-ci-tests.ps1 -Path ./scripts/tests -OutputDir ./test-results

      - name: Publish NUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-nunit-results
          path: ./test-results/testResults.xml
          if-no-files-found: warn

  validate:
    name: Validate — SSoT in sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

        - name: Check opencode.json matches SSoT
        # Regenerate pipeline: opencode-base.json + generator + agent-overrides.json
        # must produce exactly the committed opencode.json. Exit 1 on mismatch.
        run: |
          node ./scripts/lib/generate-opencode-config.js --validate
          if ($LASTEXITCODE -ne 0) { Write-Error "opencode.json stale vs SSoT — run scripts/regenerate-opencode.ps1 -Yes"; exit 1 }
          Write-Output "OK: opencode.json in sync with SSoT"

  pssa-lint:
    name: Linter — PSScriptAnalyzer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }

      - name: Run PSScriptAnalyzer (security + correctness)
        # Only security/correctness rules — style rules deferred to quality-gate.yml
        run: |
          $rules = @('PSAvoidUsingInvokeExpression', 'PSAvoidUsingWriteHost', 'PSAvoidUsingPlainTextForPassword', 'PSAvoidUsingUsernameAuthentically')
          $results = Invoke-ScriptAnalyzer -Path ./scripts -Recurse -IncludeRule $rules -PassThru
          if ($results.Count -gt 0) {
            Write-Error "PSScriptAnalyzer: $($results.Count) issues found"
            $results | Format-Table -Property RuleName, Line, Message -AutoSize
            exit 1
          }
          Write-Output "OK: PSScriptAnalyzer passed (security + correctness)"