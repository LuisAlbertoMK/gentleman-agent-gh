name: Bug Report
description: Report a bug in gentleman-agent-gh
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Run `git log --oneline -1` and paste the hash
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - WSL
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Error messages, script output, or screenshots
      render: shell
